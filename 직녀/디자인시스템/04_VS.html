<meta charset="utf-8">
<title>직녀 VS — 가격 정당화</title>
<!--
  청월당 result_15(POINT 5 + VS 비교표)를 직녀로 옮긴 판.
  이 컷의 일: 앞에서 쌓은 분량·정확도를 **값으로 환산**해 마지막 저항을 없앤다.
  정점은 「17,900원」 하나. 비교 카드 3장은 조용히(400·무채색) 깔아 대비를 만든다.
  카드 열이 좌우로 잘리는 것도 원본 장치다 — "이것 말고도 더 있다"를 그림으로 말한다.
-->
<style>
@font-face{font-family:P;src:url(fonts/Pretendard-Regular.woff2)format("woff2");font-weight:400}
@font-face{font-family:P;src:url(fonts/Pretendard-Medium.woff2)format("woff2");font-weight:500}
@font-face{font-family:P;src:url(fonts/Pretendard-SemiBold.woff2)format("woff2");font-weight:600}
@font-face{font-family:P;src:url(fonts/Pretendard-Bold.woff2)format("woff2");font-weight:700}
@font-face{font-family:P;src:url(fonts/Pretendard-ExtraBold.woff2)format("woff2");font-weight:800}
@font-face{font-family:P;src:url(fonts/Pretendard-Black.woff2)format("woff2");font-weight:900}

*{margin:0;padding:0;box-sizing:border-box}
body{width:1125px;font-family:P,sans-serif;letter-spacing:-0.025em;overflow-x:hidden;
  background:
    radial-gradient(ellipse 120% 50% at 50% 0%,#241C46 0%,rgba(36,28,70,0) 58%),
    radial-gradient(ellipse 90% 40% at 78% 92%,#2A2050 0%,rgba(42,32,80,0) 60%),
    linear-gradient(180deg,#0D0B1C 0%,#12112A 46%,#0B0F1A 100%)}

.head{padding:196px 0 0;text-align:center;position:relative}
/* 헤드 뒤 후광 — 원본도 같은 자리에 옅은 원을 깐다 */
.head:before{content:"";position:absolute;left:50%;top:300px;transform:translateX(-50%);
  width:820px;height:520px;border-radius:50%;pointer-events:none;
  background:radial-gradient(ellipse,rgba(169,139,217,.20) 0%,rgba(169,139,217,.07) 50%,rgba(169,139,217,0) 72%)}
.badge{position:relative;display:inline-block;border:3px solid #A98BD9;color:#A98BD9;
  font-size:40px;font-weight:700;letter-spacing:.06em;padding:15px 48px;border-radius:999px}
.h2{position:relative;margin-top:58px;font-size:83px;font-weight:800;line-height:1.42;color:#EFE7FA}
.h2 .accent{color:#C7B0EC}
.hr{width:62px;height:3px;background:#4B4A66;margin:60px auto}
.sub{position:relative;font-size:46px;font-weight:400;color:#B9B2CE}

/* ── 비교 카드 열 ── 좌우로 흘러 넘치게 둔다(원본 장치) */
.row{display:flex;align-items:flex-start;gap:34px;margin:120px 0 0;padding:0 0 0 24px;width:1320px}
.pc{flex:none;width:300px;background:linear-gradient(168deg,#F7F4FB,#E2D9F0);border:3px solid rgba(217,199,232,.5);border-radius:22px;
  padding:38px 0 44px;text-align:center;box-shadow:0 26px 60px rgba(10,8,26,.55)}
.pc.drop{margin-top:74px}
.pc .lb{display:inline-block;background:#6B4C9A;color:#fff;border-radius:999px;
  padding:13px 30px;font-size:40px;font-weight:800}
.pc .amt{margin-top:32px;font-size:52px;font-weight:700;color:#241F33;line-height:1.42}
.pc .amt i{display:block;font-style:normal;font-size:40px;color:#8A83A0;font-weight:400;line-height:1.1}

.vs{margin:104px 0 116px;text-align:center;font-size:150px;font-weight:900;color:#A98BD9;
  letter-spacing:.02em;line-height:1}

/* ── 우리 값 ── */
.ours{position:relative;margin:0 46px 190px;height:800px}
.ours .plate{position:absolute;right:0;top:64px;width:790px;height:520px;border-radius:28px;
  background:linear-gradient(140deg,#1B1B33 0%,#2A2246 58%,#3A2B5C 100%);
  box-shadow:0 24px 60px rgba(40,28,80,.28)}
.ours .plate:after{content:"";position:absolute;inset:0;border-radius:28px;
  background:radial-gradient(circle at 78% 22%,rgba(217,199,232,.20) 0%,rgba(217,199,232,0) 46%)}
.ours .txt{position:absolute;right:56px;top:218px;width:600px;text-align:right;z-index:2}
.ours .nm{font-size:56px;font-weight:800;color:#D9C7E8}
.ours .pr{margin-top:26px;font-size:130px;font-weight:900;color:#fff;line-height:1;letter-spacing:-.03em}
.ours .pr span{font-size:56px;font-weight:800;margin-left:12px;letter-spacing:0}
.ours .cut{position:absolute;left:2px;bottom:6px;width:392px;z-index:3;filter:drop-shadow(0 16px 34px rgba(40,28,80,.30))}
</style>

<div class="head">
  <span class="badge">POINT 5</span>
  <div class="h2">그럼에도,<br><span class="accent">가장 적게 드는 값</span></div>
  <div class="hr"></div>
  <div class="sub">인연을 만나려고, 다른 곳에서는 얼마를 쓰게 될까요?</div>
</div>

<div class="row">
  <div class="pc"><span class="lb">사주 상담</span>
    <div class="amt">3만원<i>~</i>20만원</div></div>
  <div class="pc drop"><span class="lb">연애 코칭</span>
    <div class="amt">30만원<i>~</i>300만원</div></div>
  <div class="pc"><span class="lb">결혼정보회사</span>
    <div class="amt">200만원<i>~</i>2000만원</div></div>
  <div class="pc drop"><span class="lb">소개팅 앱</span>
    <div class="amt">월 3만원<i>~</i>15만원</div></div>
</div>

<div class="vs">VS</div>

<div class="ours">
  <div class="plate"></div>
  <div class="txt">
    <div class="nm">직녀의 연애예보</div>
    <div class="pr">17,900<span>원</span></div>
  </div>
  <img class="cut" src="sd1.png">
</div>
